<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>编辑建行商户规则原型</title>
  <script>
    if (new URLSearchParams(location.search).get('embed') === '1') document.documentElement.classList.add('embed');
  </script>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-width: 1280px;
      background: #f3f3f3;
      color: #555;
      font-family: "Microsoft YaHei", "PingFang SC", Arial, sans-serif;
    }
    .app { display: flex; min-height: 100vh; zoom: .88; }
    .embed .app { zoom: .62; }
    .sidebar {
      width: 248px;
      flex: 0 0 248px;
      background: #fff;
      border-right: 1px solid #e5e5e5;
      min-height: 100vh;
    }
    .brand { padding: 24px 18px 18px; text-align: center; }
    .logo {
      width: 116px;
      height: 116px;
      margin: 0 auto 14px;
      border-radius: 50%;
      background: #050505;
      color: #fff;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      line-height: 1.1;
    }
    .logo .sogal { font-size: 11px; letter-spacing: 1px; }
    .logo .cn { font-size: 13px; margin-top: 3px; }
    .logo .vip { font-size: 30px; font-weight: 800; margin-top: 6px; }
    .brand-title { font-size: 21px; font-weight: 700; color: #222; }
    .menu { padding: 6px 0 30px; }
    .menu-item, .submenu-item {
      height: 48px;
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 0 22px;
      font-size: 16px;
      font-weight: 700;
      color: #5d646b;
      white-space: nowrap;
    }
    .menu-item .icon, .submenu-item .icon { width: 20px; text-align: center; color: #7b8085; font-size: 17px; }
    .menu-item .arrow { margin-left: auto; color: #a0a0a0; font-size: 13px; }
    .submenu-item { padding-left: 52px; height: 42px; font-size: 15px; }
    .content { flex: 1; min-width: 0; }
    .topbar {
      height: 76px;
      background: #f8f8f8;
      border-bottom: 1px solid #e2e2e2;
      display: flex;
      align-items: stretch;
    }
    .hamburger {
      width: 62px;
      height: 76px;
      background: #18aa92;
      color: #fff;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 24px;
      font-weight: 700;
    }
    .module-nav { display: flex; align-items: stretch; }
    .module {
      min-width: 112px;
      padding: 0 14px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      color: #8b8b8b;
      font-size: 16px;
      font-weight: 700;
      border-right: 1px solid #ececec;
    }
    .module.active { background: #18aa92; color: #fff; }
    .module .module-icon { font-size: 20px; }
    .tabs {
      height: 48px;
      background: #fff;
      border-bottom: 2px solid #18aa92;
      display: flex;
      align-items: stretch;
    }
    .tab-left, .tab-right-btn {
      width: 42px;
      border-right: 1px solid #e7e7e7;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #999;
      font-size: 14px;
      background: #fff;
    }
    .tab {
      padding: 0 18px;
      border-right: 1px solid #e7e7e7;
      display: flex;
      align-items: center;
      color: #777;
      font-size: 15px;
    }
    .tab.active { background: #18aa92; color: #fff; }
    .tab .close { margin-left: 12px; font-weight: 700; }
    .tab-spacer { flex: 1; }
    .main { padding: 24px 24px 60px; }
    .panel {
      background: #fff;
      border: 1px solid #e4e4e4;
      min-height: 720px;
    }
    .panel-title {
      height: 72px;
      display: flex;
      align-items: center;
      padding-left: 28px;
      font-size: 20px;
      font-weight: 700;
      color: #333;
      border-bottom: 1px solid #e5e5e5;
    }
    .panel-body { padding: 28px 34px 48px; }
    .top-back {
      width: 88px;
      height: 44px;
      border: 0;
      border-radius: 3px;
      background: #18aa92;
      color: #fff;
      font-size: 17px;
      font-weight: 700;
      font-family: inherit;
      margin-bottom: 32px;
    }
    .form { margin-top: 12px; }
    .form-row {
      display: grid;
      grid-template-columns: 300px 920px;
      align-items: center;
      min-height: 58px;
      margin-bottom: 25px;
    }
    .form-row.help-row {
      min-height: 22px;
      margin-top: -22px;
      margin-bottom: 24px;
    }
    .label {
      padding-right: 30px;
      text-align: right;
      color: #555;
      font-size: 18px;
      font-weight: 700;
    }
    .required { color: #f00; margin-left: 4px; }
    .input, .select {
      height: 50px;
      border: 1px solid #dcdcdc;
      background: #fff;
      padding: 0 14px;
      color: #555;
      font-size: 16px;
      outline: none;
      border-radius: 1px;
      font-family: inherit;
    }
    .input.name { width: 720px; }
    .select { width: 720px; }
    .select-wrap { position: relative; width: 720px; }
    .select-wrap::after {
      content: "▾";
      position: absolute;
      right: 14px;
      top: 12px;
      color: #777;
      pointer-events: none;
      font-size: 16px;
    }
    .help {
      color: #999;
      font-size: 14px;
      line-height: 22px;
    }
    .radio-group, .checkbox-group {
      display: flex;
      align-items: center;
      gap: 38px;
      min-height: 50px;
      font-size: 16px;
      color: #555;
    }
    .radio, .checkbox {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      white-space: nowrap;
    }
    .radio-dot {
      width: 15px;
      height: 15px;
      border-radius: 50%;
      border: 1px solid #bcbcbc;
      background: #fff;
      position: relative;
      display: inline-block;
    }
    .radio.checked .radio-dot {
      border-color: #1e9fff;
    }
    .radio.checked .radio-dot::after {
      content: "";
      position: absolute;
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: #1e9fff;
      top: 3px;
      left: 3px;
    }
    .checkbox-box {
      width: 15px;
      height: 15px;
      border: 1px solid #bcbcbc;
      background: #fff;
      display: inline-block;
    }
    .actions {
      width: 920px;
      margin-left: 300px;
      display: flex;
      justify-content: flex-end;
      gap: 10px;
      padding-top: 30px;
    }
    .btn-back, .btn-save {
      height: 44px;
      border-radius: 3px;
      font-family: inherit;
      font-size: 16px;
      font-weight: 700;
    }
    .btn-back {
      width: 96px;
      background: #fff;
      border: 1px solid #d7d7d7;
      color: #555;
    }
    .btn-save {
      width: 86px;
      border: 0;
      background: #18aa92;
      color: #fff;
    }
    .focus-highlight { position:relative; z-index:2; box-shadow:0 0 0 3px rgba(252,235,216,.72), 0 0 0 1px #a86115 inset; background:rgba(252,235,216,.10); }
  </style>
</head>
<body>
  <div class="app">
    <aside class="sidebar">
      <div class="brand">
        <div class="logo"><div class="sogal">SOGAL</div><div class="cn">索菲亚</div><div class="vip">会员VIP</div></div>
        <div class="brand-title">索菲亚会员中心</div>
      </div>
      <nav class="menu">
        <div class="menu-item"><span class="icon">▦</span><span>数据统计</span><span class="arrow">›</span></div>
        <div class="menu-item"><span class="icon">👤</span><span>会员管理</span><span class="arrow">›</span></div>
        <div class="menu-item"><span class="icon">◇</span><span>会员权益</span><span class="arrow">›</span></div>
        <div class="menu-item"><span class="icon">▣</span><span>商品管理</span><span class="arrow">›</span></div>
        <div class="menu-item"><span class="icon">▤</span><span>订单管理</span><span class="arrow">›</span></div>
        <div class="menu-item"><span class="icon">✎</span><span>报名管理</span><span class="arrow">›</span></div>
        <div class="menu-item"><span class="icon">⚙</span><span>配置管理</span><span class="arrow">›</span></div>
        <div class="menu-item"><span class="icon">☷</span><span>活动管理</span><span class="arrow">›</span></div>
        <div class="menu-item"><span class="icon">☑</span><span>任务中心</span><span class="arrow">›</span></div>
        <div class="menu-item"><span class="icon">🎁</span><span>邀请有礼</span><span class="arrow">›</span></div>
        <div class="menu-item"><span class="icon">▥</span><span>员工管理</span><span class="arrow">›</span></div>
        <div class="menu-item"><span class="icon">✉</span><span>短信营销</span><span class="arrow">›</span></div>
        <div class="menu-item"><span class="icon">¥</span><span>国补管理</span><span class="arrow">⌄</span></div>
        <div class="submenu-item"><span class="icon">└</span><span>商户规则管理</span></div>
        <div class="submenu-item"><span class="icon">└</span><span>商户管理</span></div>
      </nav>
    </aside>

    <section class="content">
      <header class="topbar">
        <div class="hamburger">☰</div>
        <div class="module-nav">
          <div class="module"><span class="module-icon">⌂</span>平台首页</div>
          <div class="module"><span class="module-icon">▧</span>基础模块</div>
          <div class="module"><span class="module-icon">▣</span>活动模块</div>
          <div class="module"><span class="module-icon">◈</span>定制模块</div>
          <div class="module active"><span class="module-icon">Ⓥ</span>会员模块</div>
          <div class="module"><span class="module-icon">☷</span>公共模块</div>
          <div class="module"><span class="module-icon">✎</span>设计师工具</div>
          <div class="module"><span class="module-icon">☘</span>切换小程序⌄</div>
        </div>
      </header>

      <div class="tabs">
        <div class="tab-left">≪</div>
        <div class="tab">首页</div>
        <div class="tab active">商户规则管理 <span class="close">×</span></div>
        <div class="tab-spacer"></div>
        <div class="tab-right-btn">≫</div>
        <div class="tab">关闭操作⌄</div>
        <div class="tab">退出 ↪</div>
      </div>

      <main class="main">
        <section class="panel">
          <div class="panel-title">编辑规则</div>
          <div class="panel-body">
            <button class="top-back">返回</button>
            <form class="form">
              <div class="form-row">
                <div class="label">规则名称<span class="required">*</span>：</div>
                <input class="input name" value="总部收款_建行监管支付规则" />
              </div>
              <div class="form-row help-row">
                <div></div>
                <div class="help">命名示例：年份+省份城市+业务类型，如：26年广东总部收款规则</div>
              </div>
              <div class="form-row">
                <div class="label">商户<span class="required">*</span>：</div>
                <div class="select-wrap"><input class="select" value="建行总部收款商户" readonly /></div>
              </div>
              <div class="form-row">
                <div class="label">支付方式<span class="required">*</span>：</div>
                <div class="radio-group">
                  <label class="radio checked"><span class="radio-dot"></span><span>建行支付</span></label>
                </div>
              </div>
              <div class="actions">
                <button type="button" class="btn-back">← 返回</button>
                <button type="button" class="btn-save">保存</button>
              </div>
            </form>
          </div>
        </section>
      </main>
    </section>
  </div>
  <script>
    function applyFocusMode() {
      const params = new URLSearchParams(location.search);
      const focus = params.get('focus');
      if (!focus) return;
      const targets = [];
      if (focus === 'payment_method') {
        document.querySelectorAll('.form-row').forEach(row => {
          if (row.textContent.includes('支付方式')) targets.push(row);
        });
      }
      if (focus === 'ccb_rule_fields') {
        document.querySelectorAll('.form-row').forEach(el => targets.push(el));
      }
      if (!targets.length) return;
      targets.forEach(el => {
        if (!el) return;
        el.classList.add('focus-highlight');
      });
    }

    window.addEventListener('DOMContentLoaded', function() {
      applyFocusMode();
    });
  </script>
</body>
</html>
