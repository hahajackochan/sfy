<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>广告曝光埋点需求访问页</title>
  <style>
    :root {
      --bg: oklch(0.975 0.01 250);
      --panel: oklch(0.995 0.006 250);
      --text: oklch(0.22 0.03 255);
      --muted: oklch(0.48 0.03 255);
      --line: oklch(0.9 0.012 250);
      --primary: oklch(0.55 0.17 255);
      --primary-soft: oklch(0.93 0.045 255);
      --danger: oklch(0.58 0.16 25);
      --shadow: 0 24px 80px rgb(33 52 92 / 12%);
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
      color: var(--text);
      background:
        radial-gradient(circle at 15% 10%, oklch(0.9 0.08 250), transparent 28rem),
        radial-gradient(circle at 85% 18%, oklch(0.92 0.06 180), transparent 26rem),
        var(--bg);
    }
    .shell {
      width: min(1160px, calc(100vw - 40px));
      min-height: 100vh;
      margin: 0 auto;
      display: grid;
      align-items: center;
      padding: 56px 0;
    }
    .panel {
      display: grid;
      grid-template-columns: 1.05fr 1fr;
      gap: 0;
      overflow: hidden;
      border: 1px solid var(--line);
      border-radius: 32px;
      background: var(--panel);
      box-shadow: var(--shadow);
    }
    .intro {
      padding: 48px;
      background: linear-gradient(145deg, oklch(0.3 0.08 255), oklch(0.42 0.1 235));
      color: oklch(0.98 0.006 250);
    }
    .eyebrow {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 8px 12px;
      border-radius: 999px;
      background: rgb(255 255 255 / 12%);
      font-size: 13px;
      font-weight: 700;
      letter-spacing: 0.02em;
    }
    h1 {
      margin: 28px 0 16px;
      font-size: clamp(34px, 4.6vw, 54px);
      line-height: 1.05;
      white-space: nowrap;
      letter-spacing: -0.045em;
    }
    .intro p {
      max-width: 34rem;
      color: oklch(0.88 0.02 250);
      font-size: 16px;
      line-height: 1.8;
    }
    .meta {
      margin-top: 36px;
      display: grid;
      gap: 12px;
      color: oklch(0.86 0.025 250);
      font-size: 14px;
    }
    .meta div {
      display: flex;
      justify-content: space-between;
      gap: 16px;
      padding: 12px 0;
      border-bottom: 1px solid rgb(255 255 255 / 14%);
    }
    .content {
      padding: 48px;
      display: grid;
      align-content: center;
      gap: 24px;
    }
    .unlock, .links {
      transition: opacity 220ms ease, transform 220ms ease;
    }
    .unlock h2, .links h2 {
      margin: 0 0 10px;
      font-size: 28px;
      letter-spacing: -0.025em;
    }
    .hint {
      margin: 0 0 22px;
      color: var(--muted);
      line-height: 1.7;
    }
    label {
      display: block;
      margin-bottom: 8px;
      color: var(--muted);
      font-size: 14px;
      font-weight: 700;
    }
    .password-row {
      display: flex;
      gap: 12px;
    }
    input {
      width: 100%;
      height: 52px;
      padding: 0 16px;
      border: 1px solid var(--line);
      border-radius: 16px;
      outline: none;
      font-size: 17px;
      color: var(--text);
      background: oklch(0.985 0.006 250);
    }
    input:focus {
      border-color: var(--primary);
      box-shadow: 0 0 0 4px color-mix(in oklch, var(--primary) 18%, transparent);
    }
    button, .link-card {
      border: 0;
      border-radius: 16px;
      font: inherit;
      cursor: pointer;
    }
    button {
      min-width: 108px;
      height: 52px;
      padding: 0 18px;
      background: var(--primary);
      color: oklch(0.99 0.006 250);
      font-weight: 800;
    }
    .error {
      min-height: 22px;
      margin-top: 12px;
      color: var(--danger);
      font-size: 14px;
      font-weight: 700;
    }
    .links { display: none; }
    .grid {
      display: grid;
      gap: 14px;
      margin-top: 20px;
    }
    .two-actions {
      grid-template-columns: repeat(2, minmax(0, 1fr));
    }
    .link-card {
      display: block;
      padding: 20px;
      border: 1px solid var(--line);
      background: oklch(0.985 0.008 250);
      color: var(--text);
      text-decoration: none;
    }
    .link-card:hover {
      border-color: color-mix(in oklch, var(--primary) 45%, var(--line));
      background: var(--primary-soft);
      transform: translateY(-1px);
    }
    .link-card strong {
      display: block;
      margin-bottom: 6px;
      font-size: 18px;
    }
    .link-card span {
      color: var(--muted);
      font-size: 14px;
      line-height: 1.6;
    }
    .footnote {
      margin-top: 8px;
      color: var(--muted);
      font-size: 13px;
      line-height: 1.6;
    }
    @media (max-width: 820px) {
      .shell { width: min(100vw - 24px, 620px); padding: 24px 0; }
      .panel { grid-template-columns: 1fr; border-radius: 24px; }
      .intro, .content { padding: 28px; }
      h1 { white-space: normal; }
      .password-row { flex-direction: column; }
      button { width: 100%; }
      .two-actions { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
  <main class="shell">
    <section class="panel">
      <div class="intro">
        <h1>广告曝光埋点需求</h1>
        <div class="meta">
          <div><span>PRD 版本</span><strong>v1.0</strong></div>
          <div><span>产品经理</span><strong>陈嘉豪</strong></div>
        </div>
      </div>

      <div class="content">
        <div id="unlock" class="unlock">
          <h2>输入访问密码</h2>
          <p class="hint">通过后即可打开 PRD 和原型页面。请不要把链接和密码转发给无关人员。</p>
          <label for="password">访问密码</label>
          <div class="password-row">
            <input id="password" type="text" inputmode="numeric" autocomplete="off" placeholder="请输入密码" />
            <button id="submit" type="button">进入</button>
          </div>
          <div id="error" class="error"></div>
        </div>

        <div id="links" class="links">
          <h2>已解锁</h2>
          <p class="hint">选择需要查看的内容。</p>
          <div class="grid two-actions">
            <a class="link-card" href="prd/prd_v1.0.html?v=202605110951">
              <strong>查看 PRD</strong>
              <span>打开完整产品需求文档。</span>
            </a>
            <a class="link-card" href="prototype/prototype_v1.0.html?v=202605110947">
              <strong>查看原型</strong>
              <span>打开广告曝光与点击埋点验证原型。</span>
            </a>
          </div>
        </div>
      </div>
    </section>
  </main>

  <script>
    const PASSWORD_HASH = '59591378';
    const SESSION_KEY = 'ad_exposure_prd_unlocked';

    function fnv1a(input) {
      let hash = 0x811c9dc5;
      const data = new TextEncoder().encode(input);
      for (const byte of data) {
        hash ^= byte;
        hash = Math.imul(hash, 0x01000193) >>> 0;
      }
      return hash.toString(16).padStart(8, '0');
    }

    function showLinks() {
      document.getElementById('unlock').style.display = 'none';
      document.getElementById('links').style.display = 'block';
    }

    function verify() {
      const input = document.getElementById('password');
      const error = document.getElementById('error');
      if (fnv1a(input.value.trim()) === PASSWORD_HASH) {
        sessionStorage.setItem(SESSION_KEY, '1');
        showLinks();
        return;
      }
      error.textContent = '密码不正确，请确认后再试。';
      input.select();
    }

    document.getElementById('submit').addEventListener('click', verify);
    document.getElementById('password').addEventListener('keydown', event => {
      if (event.key === 'Enter') verify();
    });

    if (sessionStorage.getItem(SESSION_KEY) === '1') showLinks();
  </script>
</body>
</html>
